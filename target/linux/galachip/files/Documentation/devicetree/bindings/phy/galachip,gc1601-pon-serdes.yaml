%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/galachip,gc1601-pon-serdes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaChip GC1601 PON SerDes

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The SerDes between the optical module and the GPON/EPON MAC of the
  GalaChip GC1601. Its PLL and resets are in the system control unit; the
  PON MAC sets it to GPON or EPON.

properties:
  compatible:
    const: galachip,gc1601-pon-serdes

  reg:
    items:
      - description: configuration space
      - description: control registers

  reg-names:
    items:
      - const: config
      - const: ctrl

  galachip,scu:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: The system control unit, which holds the PLL and resets.

  "#phy-cells":
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - galachip,scu
  - "#phy-cells"

additionalProperties: false

examples:
  - |
    phy@91000000 {
        compatible = "galachip,gc1601-pon-serdes";
        reg = <0x91000000 0x300000>, <0x91300000 0x100>;
        reg-names = "config", "ctrl";
        galachip,scu = <&scu>;
        #phy-cells = <0>;
    };
