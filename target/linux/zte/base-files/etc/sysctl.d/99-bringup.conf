# A panic must not enter the vendor boot path, which writes its environment.
kernel.panic=0
# Linux has about 11 MiB; the top 16 MiB is reserved for the packet engine.
vm.min_free_kbytes=256
# No swap on this device; zram is excluded from the image.
vm.swappiness=0
vm.vfs_cache_pressure=150
# Local IPv4 is for administration; subscriber IP packets stay at layer 2.
net.ipv4.ip_forward=0
