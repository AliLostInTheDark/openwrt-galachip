---
name: omci
protocol: genetlink

doc: |
  OMCI channel between the GPON MAC driver and the userspace OMCI agent:
  OMCI frame transmit and receive, agent state, ONU identity configuration
  and the MIB view used by management tools. Received OMCI frames, events
  and transmit traces are sent as unicast notifications to the socket that
  bound the device; the family has no multicast groups. Commands numbered in
  the UAPI header but not listed here are handled by the userspace agent.

attribute-sets:
  -
    name: omci
    attributes:
      -
        name: dev-id
        type: u32
        value: 1
      -
        name: ifindex
        type: u32
        value: 2
      -
        name: onu-id
        type: u16
        value: 3
      -
        name: gem-port-id
        type: u16
        value: 4
