%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/zte,zx296718-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE ZX2967 family I2C controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    oneOf:
      - const: zte,zx296718-i2c
      - items:
          - const: zte,zx279125-i2c
          - const: zte,zx296718-i2c

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-frequency: true

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/zte,zx279125-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    i2c@9a102000 {
        compatible = "zte,zx279125-i2c", "zte,zx296718-i2c";
        reg = <0x9a102000 0x1000>;
        interrupts = <GIC_SPI 28 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crm ZX279125_CLK_I2C>;
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
