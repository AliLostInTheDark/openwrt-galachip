%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/galachip,gc1601-scu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaChip GC1601 system control unit clocks

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The boot loader programs PLL0 from the oscillator. Its three outputs, the PLL
  divided by 3, 4 and 5, feed the CPU, the AHB and APB buses and the SPI
  controller. The multiplier of the PLL and the dividers of the CPU and the
  buses are read from the SCU. The clock of the SPI controller can be switched
  between PLL output 2 divided by 8 and divided by 2. The node is also a
  syscon, so that other drivers can reach the registers of the SCU.

properties:
  compatible:
    items:
      - const: galachip,gc1601-scu
      - const: syscon

  reg:
    maxItems: 1

  '#clock-cells':
    const: 1
    description: Clock IDs are in include/dt-bindings/clock/galachip,gc1601-clock.h.

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: osc

required:
  - compatible
  - reg
  - '#clock-cells'
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    clock-controller@90a00000 {
        compatible = "galachip,gc1601-scu", "syscon";
        reg = <0x90a00000 0x20000>;
        #clock-cells = <1>;
        clocks = <&osc>;
        clock-names = "osc";
    };
