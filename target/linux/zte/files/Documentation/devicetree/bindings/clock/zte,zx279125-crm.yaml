%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/zte,zx279125-crm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 clock and reset manager

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description: |
  The CRM provides the CPU, timer, UART, SPI, I2C, MDIO and network clocks.
  Clock indices are defined in include/dt-bindings/clock/zte,zx279125-clock.h.

properties:
  compatible:
    const: zte,zx279125-crm

  reg:
    maxItems: 3

  reg-names:
    items:
      - const: crm
      - const: peripheral
      - const: network

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: osc

  '#clock-cells':
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller@94000000 {
        compatible = "zte,zx279125-crm";
        reg = <0x94000000 0x1000>, <0x94400000 0x100>, <0x9a100000 0x100>;
        reg-names = "crm", "peripheral", "network";
        #clock-cells = <1>;
        clocks = <&osc>;
        clock-names = "osc";
    };
