%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/zte,zx279125-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 timers

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  Two 32-bit down-counters, one used for clock events and one as the
  free-running clocksource.

properties:
  compatible:
    const: zte,zx279125-timer

  reg:
    maxItems: 2

  reg-names:
    items:
      - const: event
      - const: source

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: event
      - const: source

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/zte,zx279125-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    timer@94401000 {
        compatible = "zte,zx279125-timer";
        reg = <0x94401000 0x100>, <0x94402000 0x100>;
        reg-names = "event", "source";
        interrupts = <GIC_SPI 17 IRQ_TYPE_EDGE_RISING>;
        clocks = <&crm ZX279125_CLK_TIMER0>, <&crm ZX279125_CLK_TIMER1>;
        clock-names = "event", "source";
    };
