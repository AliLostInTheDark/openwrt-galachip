%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/zte,zx279125-spifc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 SPI flash controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: zte,zx279125-spifc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/zte,zx279125-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    spi@94407000 {
        compatible = "zte,zx279125-spifc";
        reg = <0x94407000 0x1000>;
        interrupts = <GIC_SPI 9 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crm ZX279125_CLK_SPIFC>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "jedec,spi-nor";
            reg = <0>;
            spi-max-frequency = <25000000>;
        };
    };
