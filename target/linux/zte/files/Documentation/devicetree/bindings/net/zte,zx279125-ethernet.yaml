%YAML 1.2
---
$id: http://devicetree.org/schemas/net/zte,zx279125-ethernet.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 Ethernet CPU packet engine

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description: |
  The shared packet engine owns the UNI management traffic and optical control
  queues. Subscriber forwarding is performed by the hardware bridge. Packet
  buffers and rings must remain outside the Linux allocator, including during
  an adopted bootloader handoff. The interrupt mask is shared with the PON MAC.

allOf:
  - $ref: ethernet-controller.yaml#

properties:
  compatible:
    const: zte,zx279125-ethernet

  reg:
    maxItems: 8

  reg-names:
    items:
      - const: pp
      - const: bmu
      - const: mailbox
      - const: mac
      - const: dma
      - const: intc
      - const: global
      - const: spa

  interrupts:
    maxItems: 1

  phy-handle: true

  memory-region:
    maxItems: 1

  zte,bootloader-cursors:
    $ref: /schemas/types.yaml#/definitions/uint32
    description: |
      Physical address of the verified bootloader's CPU-only queue handoff
      table, inside the reserved packet memory. Sixteen pairs of little-endian
      u32 values contain ring bases and consumer indices. This address depends
      on the bootloader build and relocation and must be independently verified
      for another board. The source-built monitor uses 0x41840000 and updates
      this property in an external Linux FDT after checking a stopped, idle
      engine. A DTB appended to the kernel cannot receive that runtime fixup.
      Reset-state initialization creates the table itself.

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - phy-handle
  - memory-region
  - zte,bootloader-cursors

unevaluatedProperties: false
