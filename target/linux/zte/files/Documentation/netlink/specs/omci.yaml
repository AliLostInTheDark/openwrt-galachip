        name: state
        type: u8
        value: 5
      -
        name: flags
        type: u32
        value: 6
      -
        name: capabilities
        type: u32
        value: 7
      -
        name: sequence
        type: u64
        value: 8
      -
        name: pdu
        type: binary
        value: 9
      -
        name: event
        type: u8
        value: 10
      -
        name: owner-portid
        type: u32
