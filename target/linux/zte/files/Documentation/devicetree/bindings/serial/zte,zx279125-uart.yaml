%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/zte,zx279125-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 UART

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

allOf:
  - $ref: serial.yaml#

properties:
  compatible:
    const: zte,zx279125-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/zte,zx279125-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>

    serial@94405000 {
        compatible = "zte,zx279125-uart";
        reg = <0x94405000 0x1000>;
        interrupts = <GIC_SPI 11 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&crm ZX279125_CLK_UART0>;
    };
