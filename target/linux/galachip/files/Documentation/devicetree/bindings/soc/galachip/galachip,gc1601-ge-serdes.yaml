%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/galachip/galachip,gc1601-ge-serdes.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: GalaChip GC1601 gigabit Ethernet SerDes

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

description:
  The SGMII SerDes between the packet engine and the internal gigabit PHY.
  The packet engine programs its control word at cold start, and the PHY
  driver reads its status word. Both reach it as a syscon.

properties:
  compatible:
    items:
      - const: galachip,gc1601-ge-serdes
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    syscon@91400000 {
        compatible = "galachip,gc1601-ge-serdes", "syscon";
        reg = <0x91400000 0x10>;
    };
