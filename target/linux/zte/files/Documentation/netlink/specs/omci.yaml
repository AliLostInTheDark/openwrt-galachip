operations:
  list:
    -
      name: backend
      value: 18
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - backend-data
            - backend-op
            - generation
    -
      name: get
      value: 1
      attribute-set: omci
      do:
        request:
          attributes:
            []
    -
      name: bind
      value: 2
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - bind-flags
            - generation
    -
      name: unbind
      value: 3
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            []
    -
      name: tx
      value: 4
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - generation
            - pdu
    -
      name: agent-set
      value: 7
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - agent-enabled
            - agent-fake-omci
            - agent-permissive
            - olt-profile-configured
            - olt-profile-forced
    -
      name: config-get
      value: 8
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - config-key
    -
      name: config-set
      value: 9
      attribute-set: omci
      flags: [admin-perm]
      do:
        request:
          attributes:
            - config-key
            - config-value
