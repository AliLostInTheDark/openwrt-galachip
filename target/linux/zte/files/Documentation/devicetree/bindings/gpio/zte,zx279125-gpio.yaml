%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/zte,zx279125-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: ZTE Sanechips ZX279125 GPIO controller

maintainers:
  - Ifran Ali <khanu.i.i.k.2000@gmail.com>

properties:
  compatible:
    const: zte,zx279125-gpio

  reg:
    maxItems: 1

  gpio-controller: true

  '#gpio-cells':
    const: 2

required:
  - compatible
  - reg
  - gpio-controller
  - '#gpio-cells'

additionalProperties: false

examples:
  - |
    gpio@94404000 {
        compatible = "zte,zx279125-gpio";
        reg = <0x94404000 0x1000>;
        gpio-controller;
        #gpio-cells = <2>;
    };
